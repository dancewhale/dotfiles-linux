# ~/.aerospace.toml
# Task Mode setup for AeroSpace
#
# J = Journal
# C = Code
# R = Research
# P = Plan

config-version = 2

start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 24
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

persistent-workspaces = ['J', 'C', 'R', 'P']

workspace-to-monitor-force-assignment = { '.scratchpad.1' = 1, '.scratchpad.2' = 2 }

# Predictable root layout for each task.
after-startup-command = [
    'layout --workspace J --root h_accordion',
    'layout --workspace C --root h_tiles',
    'layout --workspace R --root h_accordion',
    'layout --workspace P --root h_tiles',
]

# ---------------------------------------------------------------------------
# App -> task routing
#
# Chrome is intentionally NOT routed globally:
# the same browser is shared by Code and Research. The task-mode script
# creates/focuses the right Chrome window in the right workspace instead.
# ---------------------------------------------------------------------------

on-window-detected = [
    # Journal
    {
        if = 'test %{app-bundle-id} = com.bloombuilt.dayone-mac',
        run = 'move-node-to-workspace J',
    },

    # Code editors
    {
        if = 'test %{app-bundle-id} = com.todesktop.230313mzl4w4u92',
        run = 'move-node-to-workspace C',
    },
    # Setting floating app.
    {
        if = 'test %{app-bundle-id} = com.apple.systempreferences',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.tencent.xinWeChat',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.finder',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.comisys.lanxin.hgo',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = com.agiletortoise.Drafts-OSX',
        run = 'layout floating',
    },
    {
        if = 'test %{app-bundle-id} = org.mozilla.firefox',
        run = 'layout floating',
    },
]

exec-on-workspace-change = [
  '/bin/bash', '-c',
  'aerospace-scratchpad hook pull-window $AEROSPACE_PREV_WORKSPACE $AEROSPACE_FOCUSED_WORKSPACE'
]


# ---------------------------------------------------------------------------
# Keyboard fallback.
# Alfred is the main launcher; these are useful for direct navigation.
# ---------------------------------------------------------------------------

[mode.main.binding]

# Window focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Window movement
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Task workspaces
alt-1 = 'workspace J'
alt-2 = 'workspace C'
alt-3 = 'workspace R'
alt-4 = 'workspace P'

# Move the current window into a task workspace
alt-shift-1 = 'move-node-to-workspace J'
alt-shift-2 = 'move-node-to-workspace C'
alt-shift-3 = 'move-node-to-workspace R'
alt-shift-4 = 'move-node-to-workspace P'

alt-tab = 'workspace-back-and-forth'

# Maintenance mode
alt-shift-semicolon = 'mode service'

# APP show
cmd-ctrl-f = 'exec-and-forget aerospace list-workspaces --monitor mouse --visible | aerospace workspace --stdin && aerospace-scratchpad show Firefox'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']


[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0
