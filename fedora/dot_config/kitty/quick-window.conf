initial_window_width 640
initial_window_height 800
window_border_width 1pt
draw_minimal_borders no
draw_window_borders_for_single_window yes
window_margin_width 0 0 0 0
# Reserve room for the 3pt border. Without this, the left and right
# borders of a single layer-shell window are drawn outside the viewport
# and get clipped by the compositor.
single_window_margin_width 1 1 1 1
single_window_padding_width  0
font_size 12.0
font_family      family="Iosevka Term"

# Kept from the former current-theme.conf; this is behavior, not a color theme.
enabled_layouts tall,vertical,grid,splits,stack

# This direct include is also the source of the quick-access shortcuts.
# When keymaps.conf changes, reload or recreate the persistent quick-access
# instance so that it picks up the new mappings.
include keymaps.conf
include theme/current.conf
